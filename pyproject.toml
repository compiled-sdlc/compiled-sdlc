[project]
name = "compiled-sdlc"
version = "0.1.0"
description = "Experiment pipeline for a dual-representation lifecycle protocol for agentic software delivery"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema[format-nongpl]>=4.23",
    "matplotlib>=3.11.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The IR validator package and the pipelines live in the tree, not in the environment.
known-first-party = ["lcir", "pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
