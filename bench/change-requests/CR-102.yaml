id: CR-102
title: Pet creation rejects an invalid request body
category: bug_fix
modules: [customers]
risk_class: standard
needs_stack: false
difficulty: single_endpoint
difficulty_rationale: >-
  One missing annotation. Retained as a floor: it is the cheapest change in the set, and an arm that cannot do this cannot do any of the others.

statement: |
  Creating a pet accepts a request body that fails its own declared
  constraints. The body's name is declared as needing at least one character,
  but the constraint is never applied, so a pet can be created with an empty
  name.

  Make the create operation apply the constraints declared on its request body.

behaviours:
  - id: invalid-body-rejected
    statement: A body that violates a constraint declared on it is answered 400 Bad Request and creates nothing.
  - id: valid-body-still-creates
    statement: A valid body still answers 201 Created with the created pet, as it does today.

boundaries:
  - id: no-new-dependency
    category: architecture
    obligation: must
    statement: The validation the module needs is already on its classpath; add no dependency.
  - id: constraint-stays-declared
    category: architecture
    obligation: must
    statement: Enforce the constraint the request body already declares rather than deleting it or reimplementing it elsewhere.
  - id: customers-service-only
    category: architecture
    obligation: must
    statement: The fix belongs in the customers service.

context: |
  The endpoint is the pet creation operation in the customers service. The
  equivalent operation in the visits service already applies its body
  constraints; this one does not.

must_invariants:
  - id: invariant:existing-tests-pass
    kind: module_tests_pass
    statement: The tests the module already had must still pass.
  - id: invariant:no-new-dependency
    kind: no_new_dependency
    statement: No dependency may be added to the module; the validation the module needs is already on its classpath.
  - id: invariant:constraint-stays-on-the-request
    kind: text_present
    paths:
      - spring-petclinic-customers-service/src/main/java/org/springframework/samples/petclinic/customers/web/PetRequest.java
    pattern: "@Size\\(min = 1\\)"
    statement: The declared constraint must be enforced, not deleted or moved.
  - id: invariant:customers-service-only
    kind: paths_untouched
    prefixes:
      - spring-petclinic-visits-service
      - spring-petclinic-vets-service
      - spring-petclinic-api-gateway
    statement: The fix belongs in the customers service.

acceptance:
  - id: check:customers.pet-create.rejects-invalid-body
    module: customers
    source: bench/checks/CR-102/PetCreationValidationAcceptanceTest.java
    destination: spring-petclinic-customers-service/src/test/java/org/springframework/samples/petclinic/customers/web/PetCreationValidationAcceptanceTest.java
    test_class: org.springframework.samples.petclinic.customers.web.PetCreationValidationAcceptanceTest
    statement: An empty name is rejected with 400 and creates nothing; a valid body still creates a pet.
