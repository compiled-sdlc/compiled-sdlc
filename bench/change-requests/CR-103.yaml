id: CR-103
title: List an owner's pets
category: feature
modules: [customers]
risk_class: low
needs_stack: false
difficulty: single_endpoint
difficulty_rationale: >-
  A read endpoint over data the owner record already holds. Retained as the feature-category floor.

statement: |
  There is no way to ask the customers service for all of an owner's pets. A
  caller that wants them has to fetch each pet by identifier, which it can only
  do if it already knows the identifiers.

  Add a read operation at GET /owners/{ownerId}/pets.

  An owner's pets are the ones the owner record already holds; this operation
  reads them, it does not introduce a second place they are kept.

behaviours:
  - id: lists-the-owners-pets
    statement: The operation answers 200 with the owner's pets as a JSON array, each element in the same representation the single-pet read already returns.
  - id: empty-owner-empty-array
    statement: An owner with no pets is answered 200 with an empty array.
  - id: unknown-owner-not-found
    statement: An owner that does not exist is answered 404 Not Found.

boundaries:
  - id: reuse-the-representation
    category: compatibility
    obligation: must
    statement: Reuse the existing pet representation as it stands; do not redefine it.
  - id: single-pet-read-unchanged
    category: compatibility
    obligation: must
    statement: The existing single-pet read keeps its path and its behaviour.
  - id: no-new-dependency
    category: architecture
    obligation: must
    statement: Add no dependency to the module.
  - id: customers-service-only
    category: architecture
    obligation: must
    statement: The feature belongs in the customers service.

context: |
  The single-pet read operation in the customers service already renders a pet
  in the representation this operation should reuse.

must_invariants:
  - id: invariant:existing-tests-pass
    kind: module_tests_pass
    statement: The tests the module already had must still pass.
  - id: invariant:no-new-dependency
    kind: no_new_dependency
    statement: No dependency may be added to the module.
  - id: invariant:single-pet-read-unchanged
    kind: text_present
    paths:
      - spring-petclinic-customers-service/src/main/java/org/springframework/samples/petclinic/customers/web/PetResource.java
    pattern: "owners/\\*/pets/\\{petId\\}"
    statement: The existing single-pet read must keep its path.
  - id: invariant:representation-unchanged
    kind: file_unchanged
    paths:
      - spring-petclinic-customers-service/src/main/java/org/springframework/samples/petclinic/customers/web/PetDetails.java
    statement: The pet representation is reused as it stands, not redefined.
  - id: invariant:customers-service-only
    kind: paths_untouched
    prefixes:
      - spring-petclinic-visits-service
      - spring-petclinic-vets-service
      - spring-petclinic-api-gateway
    statement: The feature belongs in the customers service.

acceptance:
  - id: check:customers.owner-pets.list
    module: customers
    source: bench/checks/CR-103/OwnerPetsListAcceptanceTest.java
    destination: spring-petclinic-customers-service/src/test/java/org/springframework/samples/petclinic/customers/web/OwnerPetsListAcceptanceTest.java
    test_class: org.springframework.samples.petclinic.customers.web.OwnerPetsListAcceptanceTest
    statement: The list answers with the owner's pets, an empty array when there are none, and 404 for an unknown owner.
