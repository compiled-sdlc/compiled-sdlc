# Pinned target application for the experiment.
#
# The application is never vendored into this repository; `make bench-setup`
# clones it at the exact commit below into a location that is not tracked here.
# Every run works from a fresh checkout of this pin, so a result is attributable
# to one state of one application.

schema_version = 1

[target]
name = "spring-petclinic-microservices"
repository = "https://github.com/spring-petclinic/spring-petclinic-microservices.git"
commit = "3858f9c630cf989bb6809a86edf47c2be78dc9f1"
commit_date = "2026-08-21T06:42:46Z"
branch_at_pin = "main"
license = "Apache-2.0"
pinned_on = "2026-08-28"
# Relative to the repository root; excluded from tracking.
checkout = "bench/target"

[build]
java_version = "17"
version = "4.0.1"
# Containers are not available on the experiment machine, so the pin's
# buildDocker profile and compose file are not used. The application is built as
# plain executable jars and run as folder-local JVM processes by infra/stack.py,
# which needs no daemon, no image registry and no administrative rights. The
# deployment substrate differs from the pin's convenience path; the application,
# its configuration and its wire behaviour do not.
build_command = "./mvnw --batch-mode -DskipTests package"
up_command = "python infra/stack.py start"
down_command = "python infra/stack.py stop"
status_command = "python infra/stack.py status"
health_timeout_seconds = 300
# Where the runner keeps pid files, logs and its record of what it started.
runtime_directory = "runs/stack"

# The services the local stack starts, in the order it starts them. Each is
# waited for on its own health endpoint before the next is launched, which is
# what the compose file expressed with service_healthy conditions.
#
# The genai service is excluded: it needs an external model credential to boot,
# and nothing in the change-request set touches it.
[[build.services]]
name = "config-server"
module = "config"
port = 8888
health = "/actuator/health"
wait_seconds = 120

[[build.services]]
name = "discovery-server"
module = "discovery"
port = 8761
health = "/actuator/health"
wait_seconds = 120

[[build.services]]
name = "customers-service"
module = "customers"
port = 8081
health = "/actuator/health"
wait_seconds = 120

[[build.services]]
name = "vets-service"
module = "vets"
port = 8083
health = "/actuator/health"
wait_seconds = 120

[[build.services]]
name = "visits-service"
module = "visits"
port = 8082
health = "/actuator/health"
wait_seconds = 120

[[build.services]]
name = "api-gateway"
module = "gateway"
port = 8080
health = "/actuator/health"
wait_seconds = 120

[test]
# {module} and {tests} are substituted by the verification harness. Verification
# needs the JDK and the pin's own Maven wrapper; it does not need the stack
# running, because the change-request set is verified by module tests.
module_test_command = "./mvnw --batch-mode -pl {module} -am test -Dtest={tests}"
module_suite_command = "./mvnw --batch-mode -pl {module} -am test"
module_build_command = "./mvnw --batch-mode -pl {module} -am -DskipTests package"

[modules]
customers = "spring-petclinic-customers-service"
vets = "spring-petclinic-vets-service"
visits = "spring-petclinic-visits-service"
gateway = "spring-petclinic-api-gateway"
config = "spring-petclinic-config-server"
discovery = "spring-petclinic-discovery-server"
admin = "spring-petclinic-admin-server"
genai = "spring-petclinic-genai-service"
